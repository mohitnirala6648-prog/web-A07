<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: beige;
        }
        main{
            width: 960px;
            height: 1000px;
            background-color: antiquewhite;
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        header{
            width: 960px;
            height: 100px;
            background-color: aquamarine;
        }
        nav{
            max-width: 960px;
            height: 80px;
            background-color: bisque;
        }
        section{
            width: 960px;
            height: 400px;
            display: flex;
            flex-direction: row;
            column-gap: 10px;
        }
        #left{
            flex-grow: 1;
            background-color: blanchedalmond;
        }
        #right{
            flex-grow: 2;
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        footer{
            width: 960px;
            height: 300px;
            background-color: azure;
        }
    </style>
</head>
<body>
    <main>

        <header>
            <h2>Header</h2>
        </header>

        <nav>
            <h2>Navbar</h2>
        </nav>
        <section>
            <div id=" left"></div>
            <div id="right"></div>
        </section>

        <footer>
            <h2>Footer</h2>
        </footer>

    </main>
</body>
</html>
